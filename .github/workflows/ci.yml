name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: brew bundle

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun swift-format --version
          swiftlint version
          xcodegen --version

      - name: Format, lint, build, and analyze
        run: tools/check.sh

      - name: Check formatting
        run: |
          if ! git diff --exit-code; then
            echo "::error::swift-format changed these files. Run tools/check.sh and commit the result."
            exit 1
          fi

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build/check.log
          if-no-files-found: ignore
