included:
  - Segue
  - CLI
excluded:
  - build
  - Segue.xcodeproj

strict: true

disabled_rules:
  - syntactic_sugar
  - line_length
  - trailing_comma
  - opening_brace
  - todo

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - optional_enum_case_matching
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - weak_delegate
  - yoda_condition

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

identifier_name:
  min_length: 1
  excluded: [x, y, id, to]

type_name:
  min_length: 1

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 700
  error: 1000

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

nesting:
  type_level: 3

custom_rules:
  no_comments:
    name: No comments
    message: Write self-explanatory code instead of comments.
    regex: (//|/\*)
    match_kinds:
      - comment
      - doccomment
    severity: error
  no_reduce:
    name: No reduce
    message: Use a for-in loop instead of reduce.
    regex: \.reduce\s*\(
    excluded_match_kinds:
      - string
      - comment
      - doccomment
    severity: error
  array_generic_syntax:
    name: Array generic syntax
    message: Write Array<Element> instead of [Element].
    regex: (?<=(:|->|<|,)\s?)\[[A-Z][A-Za-z0-9_.]*\??\](?![(.\[])
    excluded_match_kinds:
      - string
      - comment
      - doccomment
    severity: error
