name: Segue
options:
  bundleIdPrefix: com.firatciftci
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 55PN4MC8Q6
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SPARKLE_PUBLIC_KEY: "psg2AMeYLSSKrPN9abYWpxMFHeup2XfOtxMe7kFZp7Y="
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Segue:
    type: application
    platform: macOS
    sources:
      - path: Segue
        excludes:
          - Resources/AppIcon.icon
          - Resources/AppIcon.icon/**
      - path: Segue/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: SegueCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    entitlements:
      path: Segue/Segue.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: Segue/Info.plist
      properties:
        CFBundleDisplayName: Segue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Firat Ciftci"
        NSAppleEventsUsageDescription: "Segue reads the address of the frontmost browser tab to apply your website rules."
        CFBundleURLTypes:
          - CFBundleURLName: com.firatciftci.Segue
            CFBundleURLSchemes:
              - segue
        SUFeedURL: https://github.com/firatciftci/segue/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firatciftci.Segue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
  SegueCLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
      - path: Segue/Model/InputSource.swift
    settings:
      base:
        PRODUCT_NAME: segue
        PRODUCT_BUNDLE_IDENTIFIER: com.firatciftci.Segue.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
